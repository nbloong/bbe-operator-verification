name: Verify current operator assets
on:
  push:
    branches:
      - clean-rebuild-staging-20260812
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate LM001-LM007 document payloads
        shell: python
        run: |
          import base64, json, pathlib, sys
          root = pathlib.Path('assets/docs')
          failed = []
          for n in range(1, 8):
              oid = f'BBE-LM-{n:03d}'
              p = root / f'{oid}.json'
              try:
                  data = json.loads(p.read_text(encoding='utf-8'))
                  card = data.get('card','')
                  if oid == 'BBE-LM-004':
                      cert = (root / 'BBE-LM-004-cert.txt').read_text(encoding='utf-8').strip()
                  else:
                      cert = data.get('cert','')
                  for kind, txt in [('card', card), ('cert', cert)]:
                      raw = base64.b64decode(txt, validate=True)
                      ok = len(raw) > 20 and raw[:4] == b'RIFF' and raw[8:12] == b'WEBP'
                      if not ok:
                          raise ValueError(f'{kind} is not valid WEBP')
                  print(f'{oid}: PASS')
              except Exception as e:
                  failed.append((oid, str(e)))
                  print(f'{oid}: FAIL - {e}')
          if failed:
              print('OVERALL: FAIL')
              sys.exit(1)
          print('OVERALL: PASS - ALL 7 CURRENT PAYLOADS VALID')
