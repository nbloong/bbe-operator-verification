name: Patch LM006 operator page
on:
  push:
    branches:
      - lm006-cert-fix-20260812
    paths:
      - .github/workflows/patch-lm006-operator.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch LM006 certificate source
        shell: python
        run: |
          from pathlib import Path
          p=Path('operator.html')
          s=p.read_text(encoding='utf-8')
          old="}else{cert.src='data:image/webp;base64,'+p.cert}"
          new="}else if(id==='BBE-LM-006'){cert.src='assets/docs/BBE-LM-006-cert.webp'}else{cert.src='data:image/webp;base64,'+p.cert}"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          assert "BBE-LM-006-cert.webp" in s
      - name: Commit page fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operator.html
          git commit -m "Use verified image for LM006 certificate"
          git push
